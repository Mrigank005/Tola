# Common to every version we hold (not repeated above):
#   - Closing price = weighted average price of the last half hour of trading. On expiry day the
#     settlement price is the DDR, not the closing price.
#   - Delivery period margin = higher of (3% + 5-day 99% VaR of spot) or 25%.
#   - Tender days include the expiry day; on expiry, all open positions are marked for compulsory delivery.
