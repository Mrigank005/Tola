        delivery: {unit_g: 1000, form: "995 serially numbered gold bars (LBMA-approved suppliers)", centres: [Ahmedabad, Mumbai, New Delhi]}
        tender: {days: 3, margin_pct: 8.34}
        ddr: {rule: avg_last_poll_3d}
        making_charge_inr_per_g: null
      - from: 2027-02
