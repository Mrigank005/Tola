        url: https://www.mcxindia.com/docs/default-source/about-us/gold-february-2027-contract-onwards.pdf
        price_basis: Ex-Ahmedabad
        delivery: {unit_g: 1000, form: "995 serially numbered 1 kg bars (MCX-empanelled refiners or LBMA)", centres: [Ahmedabad, Mumbai, New Delhi]}
