# MCX gold futures: contract specifications, versioned by contract (expiry) month.
#
# Every versioned value is copied from the MCX PDF named in `source`; the PDFs are saved under
# data/raw/specs/ (downloaded 23 Oct 2026 from the links on https://www.mcxindia.com/products/bullion/gold).
# A version applies to contracts expiring in its `from` month and later, until the next version.
# Contracts older than the first version we hold get `spec_version: null` in the snapshot; for those only
# the `basis` block is used, and the snapshot marks them spec_verified = false.
#
# `basis` (lot, quote unit, purity) drives price normalisation. It is the same in every PDF we hold, and the
# build re-checks it on every traded row: VWAP = Value x 1e5 / (Volume x lot_g) must fall inside [Low, High].
#
# Spot: GetSpotMarketArchive publishes each contract's own polled spot. GOLD and GOLDM spots are 995-basis;
# GOLDTEN, GOLDGUINEA and GOLDPETAL spots are already converted to 999 (x 999/995), which G0 verified
# (GOLDTEN spot = GOLDM spot x 999/995 in 18/18 cycles). The build re-checks this.

symbols:
  GOLD:
    basis: {lot_g: 1000, quote_g: 10, purity: 995}
    spot: {product: GOLD, location: AHMEDABAD, unit_g: 10, purity: 995}
    expiry_rule: "5th of the expiry month; if a holiday, the preceding working day"
    versions:
      - from: 2026-02
        source: GOLD_2026-02.pdf
        url: https://www.mcxindia.com/docs/default-source/products/contract-specification/gold/gold-february-2026-contract-onwardsf3629751-e56a-43d9-883c-cce18c121dc4.pdf
        price_basis: Ex-Ahmedabad
        delivery: {unit_g: 1000, form: "995 serially numbered gold bars (LBMA-approved suppliers)", centres: [Ahmedabad, Mumbai, New Delhi]}
        tender: {days: 5, margin_pct: 5}
        ddr: {rule: avg_last_poll_3d}
        making_charge_inr_per_g: null
      - from: 2026-08
        source: GOLD_2026-08.pdf
        url: https://www.mcxindia.com/docs/default-source/products/contract-specification/gold/gold-august-2026-contract-onwardsd4df534857fb64e3bdfdff00007acb3574ea8ae7-7504-4567-a819-64dc0c700557.pdf
