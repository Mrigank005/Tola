# Risk-free reference for the implied-carry check (M2).
#
# Primary: FBIL 3-month T-bill benchmark, daily, fetched from https://www.fbil.org.in/wasdm/tbill/fetchcommongraph/12M
# (the public site's own chart endpoint; it serves only the last 12 months, so each refresh caches what it sees and
# history accumulates from Oct 2025 onward).
#
# Before FBIL coverage: the RBI policy repo rate. The 91-day T-bill trades close to repo (FBIL 3M was 5.4-5.7% against
# a 5.25% repo in Oct 2026), so repo is a proxy, labelled as such in rates_daily.rf_source.
# Changes from the dated list at https://stableinvestor.com/2021/10/rbi-repo-rate-history-india.html (updated
# 5 Dec 2025), cross-checked with https://www.basunivesh.com/rbi-repo-rate-history-from-2000/ . Effective from the
# MPC announcement date.

